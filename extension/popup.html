<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.4 system-ui, sans-serif; width: 340px; margin: 12px; color: #111b21; background: #fff; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  label { display: block; margin: 8px 0 2px; font-weight: 600; }
  input { width: 100%; box-sizing: border-box; padding: 6px; border: 1px solid #c8ced2; border-radius: 6px; }
  button { margin-top: 10px; padding: 6px 12px; border-radius: 6px; border: 0; background: #00a884; color: #fff; cursor: pointer; }
  ul { padding-left: 18px; margin: 6px 0; }
  .ok { color: #1b7f3b; } .bad { color: #b3261e; } .warn { color: #8a6d00; }
  small { color: #667781; }
  @media (prefers-color-scheme: dark) {
    body { background: #111b21; color: #e9edef; }
    input { background: #202c33; color: inherit; border-color: #3b4a54; }
    .ok { color: #6fd08c; } .bad { color: #f28b82; } .warn { color: #f0c24b; }
  }
</style>
</head>
<body>
  <h1>✨ Reply Copilot</h1>
  <label for="server">Server</label>
  <input id="server" placeholder="http://127.0.0.1:8765">
  <label for="token">Server token</label>
  <input id="token" type="password" placeholder="SERVER_TOKEN from your .env">
  <small>Run <code>python -m copilot init</code> to create one.</small><br>
  <button id="save">Save &amp; check setup</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
